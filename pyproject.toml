[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "classical-music-ml"
dynamic = ["version"]
description = "Winning solution of the Duke AIPI 520 Kaggle competition: predicting which orchestra patrons will buy a season subscription."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Gomez Soteres" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0,<3",  # results were produced with pandas 2; 3.0 changed string dtypes
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "jupyter>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
classical-music-ml = "classical_music_ml.train:main"

[tool.hatch.version]
path = "src/classical_music_ml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/classical_music_ml"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]  # the notebook is kept exactly as it was run

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # default config instances in function signatures are immutable dataclasses
    "UP032",   # .format() is kept where it reads more clearly in the printed reports
]

[tool.ruff.lint.isort]
known-first-party = ["classical_music_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["classical_music_ml"]
branch = true
